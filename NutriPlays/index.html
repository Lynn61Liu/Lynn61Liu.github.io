<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriPlays</title>
    <meta http-equiv="refresh" content="0; url=./RainbowMeals.html" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Gill Sans", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #fff6dc 0%, #dff6ff 100%);
        color: #173042;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 60px rgba(23, 48, 66, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 18px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        background: #173042;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening NutriPlays</h1>
      <p>
        Redirecting to the main experience. If the demo does not open
        automatically, choose a page below.
      </p>
      <div class="actions">
        <a href="./RainbowMeals.html">Open Rainbow Meals</a>
        <a href="./BuildingLunchBox.html">Open Building LunchBox</a>
      </div>
    </main>
  </body>
</html>
