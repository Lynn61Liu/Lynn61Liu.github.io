<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">PNP paint technician dashboard</title>
  <desc id="desc">A sanitized full-screen paint technician dashboard with stage cards, status distribution, longest vehicles in shop, filters, and a vehicle progress table.</desc>
  <defs>
    <style>
      .page { fill: #f4f7fb; }
      .surface { fill: #ffffff; stroke: #dfe7f0; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #dce5ef; stroke-width: 1; }
      .title { fill: #162235; font: 800 26px Arial, sans-serif; }
      .subtitle { fill: #52627a; font: 15px Arial, sans-serif; }
      .heading { fill: #1d2a3d; font: 800 17px Arial, sans-serif; }
      .label { fill: #58687f; font: 700 14px Arial, sans-serif; }
      .small { fill: #6d7d96; font: 13px Arial, sans-serif; }
      .value { fill: #1d2a3d; font: 16px Arial, sans-serif; }
      .metric { font: 800 30px Arial, sans-serif; }
      .blue { fill: #2563eb; }
      .gray { fill: #5b677a; }
      .cyan { fill: #0284c7; }
      .orange { fill: #c45c14; }
      .purple { fill: #a21caf; }
      .red { fill: #e11d48; }
      .brown { fill: #9a4d22; }
      .green { fill: #078960; }
      .button { fill: #ffffff; stroke: #dfe7f0; stroke-width: 1; }
      .buttonText { fill: #1d2a3d; font: 700 15px Arial, sans-serif; }
      .field { fill: #fbfcfe; stroke: #d7e1eb; stroke-width: 1; }
      .pillText { font: 700 13px Arial, sans-serif; }
      .tableHead { fill: #f8fafc; }
      .line { stroke: #e8eef5; stroke-width: 1; }
      .risk { fill: #fff4f4; stroke: #ff6b6b; stroke-width: 1.5; }
      .riskText { fill: #e11d48; font: 700 14px Arial, sans-serif; }
      .plate { fill: #111827; }
      .plateText { fill: #ffffff; font: 800 13px Arial, sans-serif; }
      .tagBlue { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1; }
      .icon { fill: none; stroke: #60718a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="page" width="1600" height="1180"/>

  <g transform="translate(70 18)">
