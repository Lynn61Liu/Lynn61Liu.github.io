      <rect class="risk" x="98" y="8" width="64" height="32" rx="16"/><text class="riskText" x="114" y="29">18d !</text>
      <rect class="plate" x="174" y="8" width="66" height="32" rx="7"/><text class="plateText" x="188" y="29">RDF77</text>
